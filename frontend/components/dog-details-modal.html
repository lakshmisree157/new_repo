<!-- New reusable dog details modal component -->
<div id="dogDetailsModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); justify-content:center; align-items:center;">
  <div class="modal-content" style="background:#fff; padding:20px; border-radius:5px; max-width:400px; width:90%;">
    <span id="closeModal" style="float:right; cursor:pointer; font-size:20px;">&times;</span>
    <h3 id="modalDogName"></h3>
    <p><strong>Breed: </strong><span id="modalDogBreed"></span></p>
    <p><strong>Age: </strong><span id="modalDogAge"></span></p>
    <p><strong>Gender: </strong><span id="modalDogGender"></span></p>
    <p><strong>Description: </strong><span id="modalDogDescription"></span></p>
    <p><strong>Center: </strong><span id="modalDogCenter"></span></p>
    <button id="requestAdoptBtn">Request to Adopt</button>
  </div>
</div>
