<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Pet Adoption System</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            text-align: center;
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-light);
        }

        .stat-card h3 {
            margin: 0 0 10px 0;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stat-card .number {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary);
        }

        .section-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .section-header h2 {
            margin: 0;
            color: #2d3436;
            font-size: 24px;
        }

        .centers-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: 10px;
        }

        .centers-table th {
            padding: 12px 20px;
            text-align: left;
            color: var(--muted);
            font-weight: 600;
            font-size: 14px;
        }

        .centers-table td {
            padding: 16px 20px;
            background: var(--bg-warm);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .centers-table tr td:first-child {
            border-left: 1px solid var(--border);
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .centers-table tr td:last-child {
            border-right: 1px solid var(--border);
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .approve-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .approve-btn:hover {
            filter: brightness(0.9);
            transform: scale(1.05);
        }

        .reject-btn {
            background: #dfe6e9;
            color: #2d3436;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .reject-btn:hover {
            background: var(--danger);
            color: white;
            transform: scale(1.05);
        }

        .loading-state {
            text-align: center;
            padding: 60px;
            color: var(--muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .message {
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: none;
            font-weight: 600;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .no-data {
            text-align: center;
            color: var(--muted);
            padding: 40px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <header class="dashboard-header">
        <div>
            <p class="eyebrow">Administration</p>
            <h1>Admin Control Panel 👑</h1>
        </div>
        <div class="header-actions">
            <button id="logoutBtn" class="ghost-btn">Logout</button>
        </div>
    </header>

    <div class="dashboard-container">
        <div id="message" class="message"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Pending Centers</h3>
                <div class="number" id="pending-count">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Centers</h3>
                <div class="number" id="total-centers">0</div>
            </div>
            <div class="stat-card">
                <h3>Approved Centers</h3>
                <div class="number" id="approved-centers">0</div>
            </div>
            <div class="stat-card">
                <h3>Rejected Centers</h3>
                <div class="number" id="rejected-centers">0</div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-header">
                <h2>Pending Center Approvals</h2>
                <button class="primary-btn light" id="refresh-btn">Refresh List</button>
            </div>

            <div id="centers-content">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Fetching pending centers...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { apiFetch } from '../assets/api.js';

        let pendingCenters = [];

        // Check authentication on page load
        window.addEventListener('DOMContentLoaded', function () {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/admin-login.html';
                return;
            }
            loadDashboard();
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function () {
            localStorage.removeItem('access_token');
            window.location.href = '/';
        });

        // Refresh button
        document.getElementById('refresh-btn').addEventListener('click', loadDashboard);

        async function loadDashboard() {
            try {
                const result = await apiFetch('/api/adoptions/admin/pending-centers', 'GET');
                pendingCenters = result.centers || [];
                displayPendingCenters(pendingCenters);
                updateStats(result.total);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showMessage('Error loading dashboard: ' + error.message, 'error');
                document.getElementById('centers-content').innerHTML = '<div class="no-data">Error loading data</div>';
            }
        }

        function updateStats(pendingCount) {
            document.getElementById('pending-count').textContent = pendingCount;
            // For demo purposes, setting static values. In a real app, you'd fetch these from the server
            document.getElementById('total-centers').textContent = pendingCount + 5; // Mock data
            document.getElementById('approved-centers').textContent = 3; // Mock data
            document.getElementById('rejected-centers').textContent = 1; // Mock data
        }

        function displayPendingCenters(centers) {
            const content = document.getElementById('centers-content');

            if (centers.length === 0) {
                content.innerHTML = '<div class="no-data">No pending centers to review</div>';
                return;
            }

            let html = `
                <table class="centers-table">
                    <thead>
                        <tr>
                            <th>Center Name</th>
                            <th>Location</th>
                            <th>Contact</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            centers.forEach(center => {
                const createdDate = center.created_at ? new Date(center.created_at).toLocaleDateString() : 'N/A';
                html += `
                    <tr>
                        <td>${center.center_name}</td>
                        <td>${center.location}</td>
                        <td>${center.contact_number}</td>
                        <td>${createdDate}</td>
                        <td class="action-buttons">
                            <button class="approve-btn" onclick="reviewCenter(${center.center_id}, 'approve')">Approve</button>
                            <button class="reject-btn" onclick="reviewCenter(${center.center_id}, 'reject')">Reject</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            content.innerHTML = html;
        }

        // Make reviewCenter function global so it can be called from onclick
        window.reviewCenter = async function (centerId, action) {
            if (!confirm(`Are you sure you want to ${action} this center?`)) {
                return;
            }

            try {
                await apiFetch(`/api/adoptions/admin/review-center/${centerId}`, 'POST', { action: action });
                showMessage(`Center ${action}d successfully!`, 'success');
                loadDashboard(); // Refresh the list
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        };

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }
    </script>
</body>

</html>
