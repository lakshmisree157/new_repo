<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopter Login - PetConnect</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            padding: 50px;
            border: 1px solid var(--border);
        }

        h1 {
            color: #2d3436;
            margin-bottom: 8px;
            font-size: 32px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 40px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3436;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-light);
            background: var(--bg-warm);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 43, 0.3);
        }

        button:disabled {
            background: var(--muted-light);
            cursor: not-allowed;
            transform: translateY(0);
            box-shadow: none;
        }

        .link {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: var(--muted);
        }

        .link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: none;
            font-size: 14px;
            font-weight: 600;
        }

        .message.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
            display: block;
        }

        .message.error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🐾 Adopter Login</h1>
        <p class="subtitle">Find your perfect pet companion</p>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" id="submitBtn">Login as Adopter</button>
        </form>

        <div class="link">
            Don't have an account? <a href="/adopter-register">Register as Adopter</a><br>
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script type="module">
        import { login } from '../assets/api.js';

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Logging in...';

            const messageEl = document.getElementById('message');
            messageEl.className = 'message';

            try {
                const result = await login(email, password);

                if (result.access_token && result.user && result.user.role === 'adopter') {
                    messageEl.className = 'message success';
                    messageEl.textContent = '✓ Login successful! Redirecting...';
                    setTimeout(() => {
                        window.location.href = '/adopter-dashboard.html';
                    }, 2000);
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = '✗ Login failed';
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = '✗ Login failed';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>

</html>
