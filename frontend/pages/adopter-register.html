<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopter Registration - Pet Adoption System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .link a {
            color: #667eea;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 Join as Adopter</h1>
        <p class="subtitle">Find your perfect pet companion</p>

        <div id="message" class="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="full_name" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="123 Main St, City, State">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone_number" placeholder="+1 (555) 123-4567">
            </div>

            <div class="form-group">
                <label for="lifestyle">Lifestyle</label>
                <select id="lifestyle" name="lifestyle">
                    <option value="">Select your lifestyle</option>
                    <option value="active">Active</option>
                    <option value="moderate">Moderate</option>
                    <option value="quiet">Quiet</option>
                </select>
            </div>

            <div class="form-group">
                <label for="home_environment">Home Environment</label>
                <select id="home_environment" name="home_environment">
                    <option value="">Select home environment</option>
                    <option value="apartment">Apartment</option>
                    <option value="house">House</option>
                    <option value="farm">Farm</option>
                </select>
            </div>

            <div class="form-group">
                <label for="family_composition">Family Composition</label>
                <select id="family_composition" name="family_composition">
                    <option value="">Select family composition</option>
                    <option value="alone">Alone</option>
                    <option value="with family">With family</option>
                    <option value="with children">With children</option>
                    <option value="with other pets">With other pets</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pet_experience">Pet Experience</label>
                <select id="pet_experience" name="pet_experience">
                    <option value="">Select pet experience</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="expert">Expert</option>
                </select>
            </div>



            <div class="form-group">
                <label for="preferred_pet_age_min">Preferred Pet Age Min (months)</label>
                <input type="number" id="preferred_pet_age_min" name="preferred_pet_age_min" min="0" placeholder="e.g., 3">
            </div>

            <div class="form-group">
                <label for="preferred_pet_age_max">Preferred Pet Age Max (months)</label>
                <input type="number" id="preferred_pet_age_max" name="preferred_pet_age_max" min="0" placeholder="e.g., 24">
            </div>

            <button type="submit" id="submitBtn">Create Adopter Account</button>
        </form>

        <div class="link">
            Already have an account? <a href="/adopter-login">Login as Adopter</a><br>
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script type="module">
        import { apiFetch } from '../assets/api.js';

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);

            const payload = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password'),
                full_name: formData.get('full_name'),
                role: 'adopter',
                address: formData.get('address'),
                phone_number: formData.get('phone_number'),
                lifestyle: formData.get('lifestyle'),
                home_environment: formData.get('home_environment'),
                family_composition: formData.get('family_composition'),
                pet_experience: formData.get('pet_experience'),

                preferred_pet_age_min: formData.get('preferred_pet_age_min') ? parseInt(formData.get('preferred_pet_age_min')) : null,
                preferred_pet_age_max: formData.get('preferred_pet_age_max') ? parseInt(formData.get('preferred_pet_age_max')) : null
            };

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Creating account...';

            const messageEl = document.getElementById('message');
            messageEl.className = 'message';

            try {
                await apiFetch('/api/auth/register', 'POST', payload);
                messageEl.className = 'message success';
                messageEl.textContent = '✓ Account created successfully! Redirecting to login...';
                document.getElementById('registerForm').reset();
                setTimeout(() => {
                    window.location.href = '/adopter-login';
                }, 2000);
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = '✗ Error: ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
