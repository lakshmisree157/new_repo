<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dogs Available for Adoption</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <header>
    <h1>Dogs Available for Adoption</h1>
    <button id="logoutBtn">Logout</button>
  </header>
  <main>
    <div id="dogsContainer">
      <ul id="dogsList"></ul>
      <p id="noDogs" style="display:none;">No dogs available for adoption at the moment.</p>
    </div>
  </main>
<script type="module">
import { apiFetch } from '../assets/api.js';

const token = localStorage.getItem('access_token');
const dogsList = document.getElementById('dogsList');
const noDogs = document.getElementById('noDogs');

async function loadDogs() {
  try {
    const result = await apiFetch('/api/pets?species=dog&is_adopted=false', 'GET', null, token);
    if (result.animals && result.animals.length > 0) {
      noDogs.style.display = 'none';
      dogsList.innerHTML = '';
      for (const dog of result.animals) {
        const li = document.createElement('li');
        li.innerHTML = `
          <strong>${dog.name}</strong> - ${dog.breed || 'Breed N/A'} - Age: ${dog.age || 'N/A'} months<br/>
          Location: ${dog.center_name || 'Unknown'}, Description: ${dog.description || 'No description'}
        `;
        dogsList.appendChild(li);
      }
    } else {
      dogsList.innerHTML = '';
      noDogs.style.display = 'block';
    }
  } catch (error) {
    alert('Failed to load dogs: ' + error.message);
  }
}

// Logout button handler
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('access_token');
  window.location.href = '/login.html';
});

loadDogs();
</script>
</body>
</html>
