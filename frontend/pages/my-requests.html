<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Adoption Requests</title>
    <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
    <header>
        <h1>My Adoption Requests</h1>
        <button id="logoutBtn">Logout</button>
    </header>
    <main>
        <div id="requestsContainer">
            <ul id="requestsList"></ul>
            <p id="noRequests" style="display:none;">You have no adoption requests.</p>
        </div>
    </main>
<script type="module">
import { apiFetch } from '../assets/api.js';

const token = localStorage.getItem('access_token');
const requestsList = document.getElementById('requestsList');
const noRequests = document.getElementById('noRequests');

async function loadRequests() {
    if (!token) {
        alert('Please login first.');
        window.location.href = '/adopter-login';
        return;
    }
    try {
        const result = await apiFetch('/api/adoptions/my', 'GET', null, token);
        if (result.requests && result.requests.length > 0) {
            noRequests.style.display = 'none';
            requestsList.innerHTML = '';
            for (const req of result.requests) {
                const li = document.createElement('li');
                li.textContent = `Request ID: ${req.request_id}, Status: ${req.status}, Request Date: ${req.request_date}, Compatibility Score: ${req.compatibility_score || 'N/A'}`;
                if (req.status === 'pending') {
                    const cancelBtn = document.createElement('button');
                    cancelBtn.textContent = 'Cancel';
                    cancelBtn.onclick = () => cancelRequest(req.request_id);
                    li.appendChild(cancelBtn);
                }
                requestsList.appendChild(li);
            }
        } else {
            requestsList.innerHTML = '';
            noRequests.style.display = 'block';
        }
    } catch (error) {
        alert('Failed to load requests: ' + error.message);
    }
}

async function cancelRequest(requestId) {
    if (!confirm('Are you sure you want to cancel this request?')) return;
    try {
        const result = await apiFetch(`/api/adoptions/request/${requestId}`, 'DELETE', null, token);
        alert(result.message || 'Request canceled.');
        await loadRequests();
    } catch (error) {
        alert('Failed to cancel request: ' + error.message);
    }
}

// Logout button handler
document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('access_token');
    window.location.href = '/adopter-login';
});

loadRequests();
</script>
</body>
</html>
