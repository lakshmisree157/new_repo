<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pet Adoption System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .role-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .role-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .role-option input[type="radio"] {
            width: auto;
        }
        
        .role-fields {
            display: none;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .role-fields.active {
            display: block;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .link a {
            color: #667eea;
            text-decoration: none;
        }
        
        .link a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .response {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            display: none;
        }
        
        .response.show {
            display: block;
        }
        
        .response pre {
            background: #222;
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <p class="subtitle">Join our pet adoption community</p>
        
        <div id="message" class="message"></div>
        
        <form id="registerForm">
            <!-- Basic Info -->
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="full_name" required>
            </div>
            
            <!-- Role Selection -->
            <div class="form-group">
                <label>Account Type</label>
                <div class="role-selector">
                    <div class="role-option">
                        <input type="radio" id="roleAdopter" name="role" value="adopter" checked>
                        <label for="roleAdopter">Pet Adopter</label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="roleCenter" name="role" value="center">
                        <label for="roleCenter">Adoption Center</label>
                    </div>
                </div>
            </div>
            
            <!-- Adopter-specific fields -->
            <div id="adopterFields" class="role-fields active">
                <h3 style="margin-bottom: 15px; font-size: 16px;">Adopter Information</h3>
                
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="123 Main St, City, State">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone_number" placeholder="+1 (555) 123-4567">
                </div>
                
                <div class="form-group">
                    <label for="lifestyle">Lifestyle</label>
                    <select id="lifestyle" name="lifestyle">
                        <option value="">Select your lifestyle</option>
                        <option value="active">active</option>
                        <option value="moderate">moderate</option>
                        <option value="quiet">quiet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="homeenvironment">homeenvironment</label>
                    <select id="home_environment" name="home_environment">
                    <option value="">-- select --</option>
                    <option value="apartment">apartment</option>
                    <option value="house">house</option>
                    <option value="farm">farm</option>
                    </select>
                </div>
                
            </div>
            
            <!-- Center-specific fields -->
            <div id="centerFields" class="role-fields">
                <h3 style="margin-bottom: 15px; font-size: 16px;">Adoption Center Information</h3>
                
                <div class="form-group">
                    <label for="centerName">Center Name</label>
                    <input type="text" id="centerName" name="center_name" placeholder="My Pet Adoption Center">
                </div>
                
                <div class="form-group">
                    <label for="address2">Address</label>
                    <input type="text" id="address2" name="address" placeholder="123 Center St, City, State">
                </div>
                
                <div class="form-group">
                    <label for="phone2">Phone Number</label>
                    <input type="tel" id="phone2" name="phone_number" placeholder="+1 (555) 123-4567">
                </div>
            </div>
            
            <button type="submit" id="submitBtn">Create Account</button>
        </form>
        
        <div class="link">
            Already have an account? <a href="/login">Login here</a>
        </div>
        
        <!-- API Response section removed for cleaner UI -->
    </div>
    
    <script src="../assets/api.js"></script>
    <script>
        // Toggle role-specific fields
        document.querySelectorAll('input[name="role"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.getElementById('adopterFields').classList.toggle('active', this.value === 'adopter');
                document.getElementById('centerFields').classList.toggle('active', this.value === 'center');
            });
        });
        
        // Form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const role = formData.get('role');
            
            const payload = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password'),
                full_name: formData.get('full_name'),
                role: role,
                address: formData.get('address'),
                phone_number: formData.get('phone_number')
            };
            
            // Add role-specific fields
            if (role === 'adopter') {
                payload.lifestyle = formData.get('lifestyle');
                payload.home_environment = formData.get('home_environment');
            } else if (role === 'center') {
                payload.center_name = formData.get('center_name');
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Creating account...';
            
            const messageEl = document.getElementById('message');
            messageEl.className = 'message';
            
            try {
                const result = await apiFetch('/api/auth/register', 'POST', payload);
                
                if (result.status === 201) {
                    messageEl.className = 'message success';
                    messageEl.textContent = '✓ Account created successfully! Redirecting to login...';
                    document.getElementById('registerForm').reset();
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = '✗ Error: ' + (result.data.error || 'Unknown error');
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = '✗ Error: ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
